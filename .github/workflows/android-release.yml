name: Android Release

on:
  push:
    branches: [main]
    paths:
      - 'android/version.properties'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify signing without creating a tag or GitHub Release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check release version
        id: release-gate
        shell: bash
        run: |
          set -euo pipefail

          version_file="android/version.properties"
          version_name="$(grep '^versionName=' "$version_file" | cut -d= -f2- | tr -d '\r')"
          version_code="$(grep '^versionCode=' "$version_file" | cut -d= -f2- | tr -d '\r')"

          if [[ -z "$version_name" || -z "$version_code" ]]; then
            echo "::error::android/version.properties must define versionName and versionCode."
            exit 1
          fi
          if ! [[ "$version_code" =~ ^[0-9]+$ ]]; then
            echo "::error::versionCode must be a positive integer, got '$version_code'."
            exit 1
          fi

          tag="v${version_name}"
          dry_run="${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}"
          previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)"
          previous_code="0"
          if [[ -n "$previous_tag" ]]; then
            previous_props="$(git show "${previous_tag}:android/version.properties" 2>/dev/null || true)"
            previous_code="$(printf '%s\n' "$previous_props" | grep '^versionCode=' | cut -d= -f2- | tr -d '\r' || true)"
            if ! [[ "$previous_code" =~ ^[0-9]+$ ]]; then
              previous_code="0"
            fi
          fi

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "previous_code=$previous_code" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"

          if [[ "$dry_run" == "true" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Dry run enabled; building and verifying signing without publishing ${tag}."
            exit 0
          fi

          if (( version_code <= previous_code )); then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "versionCode ${version_code} is not greater than previous release code ${previous_code}; skipping release."
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag ${tag} already exists. Bump android/version.properties before releasing."
            exit 1
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "Preparing release ${tag} with versionCode ${version_code}."

      - name: Set up JDK
        if: steps.release-gate.outputs.should_release == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        if: steps.release-gate.outputs.should_release == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        if: steps.release-gate.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Rust
        if: steps.release-gate.outputs.should_release == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Gradle
        if: steps.release-gate.outputs.should_release == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Restore signing key
        if: steps.release-gate.outputs.should_release == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FISHPI_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FISHPI_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FISHPI_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FISHPI_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Missing one or more FISHPI_RELEASE_* signing secrets."
            exit 1
          fi

          signing_dir="${RUNNER_TEMP}/fishpi-signing"
          keystore_file="${signing_dir}/fishpi-release.jks"
          mkdir -p "$signing_dir"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_file"

          echo "FISHPI_RELEASE_STORE_FILE=$keystore_file" >> "$GITHUB_ENV"
          echo "FISHPI_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "FISHPI_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "FISHPI_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        if: steps.release-gate.outputs.should_release == 'true'
        shell: bash
        run: gradle :android:app:assembleRelease --no-configuration-cache

      - name: Generate release notes
        if: steps.release-gate.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail

          previous_tag="${{ steps.release-gate.outputs.previous_tag }}"
          version_code="${{ steps.release-gate.outputs.version_code }}"
          version_name="${{ steps.release-gate.outputs.version_name }}"

          if [[ -n "$previous_tag" ]]; then
            commit_notes="$(git log "${previous_tag}..HEAD" --pretty=format:"- %s")"
          else
            commit_notes="$(git log HEAD --pretty=format:"- %s")"
          fi
          if [[ -z "$commit_notes" ]]; then
            commit_notes="- ${version_name}"
          fi

          {
            echo "versionCode: ${version_code}"
            echo "---"
            printf '%s\n' "$commit_notes"
          } > release-notes.md

      - name: Publish GitHub Release
        if: steps.release-gate.outputs.should_release == 'true' && steps.release-gate.outputs.dry_run != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="${{ steps.release-gate.outputs.tag }}"
          version_name="${{ steps.release-gate.outputs.version_name }}"
          apk_path="android/app/build/outputs/apk/release/app-release.apk"

          if [[ ! -f "$apk_path" ]]; then
            echo "::error::APK not found at ${apk_path}."
            exit 1
          fi

          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" "$apk_path" --title "FishPi ${version_name}" --notes-file release-notes.md

      - name: Upload dry run APK artifact
        if: steps.release-gate.outputs.should_release == 'true' && steps.release-gate.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fishpi-${{ steps.release-gate.outputs.version_name }}-${{ steps.release-gate.outputs.version_code }}-dry-run
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            release-notes.md
