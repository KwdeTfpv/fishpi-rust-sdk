name: Android Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'rc or stable'
        required: true
        default: rc
        type: choice
        options:
          - rc
          - stable
      bump:
        description: 'patch, minor, major, or none'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - none
      base_version:
        description: 'Explicit base version X.Y.Z'
        required: false
        default: ''
      dry_run:
        description: 'Build without tag or release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_BASE: ${{ inputs.base_version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          base="$INPUT_BASE"
          if [[ -z "$base" ]]; then
            latest="$(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
            if [[ -z "$latest" ]]; then
              echo "::error::No stable tag found."
              exit 1
            fi
            latest_version="${latest#v}"
            file_version="$(sed -n 's/^versionName=//p' android/version.properties | tr -d '\r' | head -n1)"
            if [[ "$file_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && [[ "$(printf '%s\n%s\n' "$latest_version" "$file_version" | sort -V | tail -n1)" == "$file_version" ]]; then
              latest_version="$file_version"
            fi
            IFS=. read -r major minor patch <<< "$latest_version"
            case "$INPUT_BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              none) ;;
              *) echo "::error::Unknown bump value."; exit 1 ;;
            esac
            base="${major}.${minor}.${patch}"
          fi

          if ! [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::base_version must be X.Y.Z."
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$base"
          version_code=$((major * 10000 + minor * 100 + patch))

          if [[ "$INPUT_CHANNEL" == "rc" ]]; then
            last_rc="$(git tag --list "v${base}-rc.*" | sed -E 's/^.*-rc\.([0-9]+)$/\1/' | sort -n | tail -n1)"
            rc=$(( ${last_rc:-0} + 1 ))
            version_name="${base}-rc.${rc}"
          else
            version_name="${base}"
          fi

          tag="v${version_name}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag ${tag} already exists."
            exit 1
          fi

          {
            echo "version_name=${version_name}"
            echo "version_code=${version_code}"
            echo "tag=${tag}"
            echo "base=${base}"
            echo "dry_run=${INPUT_DRY_RUN}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FISHPI_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FISHPI_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FISHPI_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FISHPI_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Missing one or more FISHPI_RELEASE_* signing secrets."
            exit 1
          fi

          signing_dir="${RUNNER_TEMP}/fishpi-signing"
          keystore_file="${signing_dir}/fishpi-release.jks"
          mkdir -p "$signing_dir"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_file"

          echo "FISHPI_RELEASE_STORE_FILE=$keystore_file" >> "$GITHUB_ENV"
          echo "FISHPI_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "FISHPI_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "FISHPI_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          gradle :android:app:assembleRelease --no-configuration-cache \
            -PfishpiVersionName="$VERSION_NAME" \
            -PfishpiVersionCode="$VERSION_CODE"

      - name: Generate release notes
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          previous_tag="$(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          if [[ -n "$previous_tag" ]]; then
            notes="$(git log "${previous_tag}..HEAD" --pretty=format:'- %s')"
          else
            notes="$(git log HEAD --pretty=format:'- %s')"
          fi
          if [[ -z "$notes" ]]; then
            notes="- ${VERSION_NAME}"
          fi
          printf '%s\n' "$notes" > release-notes.md

      - name: Prepare update manifest
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$apk" ]]; then
            echo "::error::APK not found."
            exit 1
          fi
          sha="$(sha256sum "$apk" | awk '{print $1}')"
          size="$(stat -c%s "$apk")"
          printf '%s\n' "$sha" > app-release.apk.sha256
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/app-release.apk"
          python3 - "$CHANNEL" "$VERSION_NAME" "$VERSION_CODE" "$sha" "$size" "$url" <<'PY'
          import json
          import sys

          channel, version_name, version_code, sha, size, url = sys.argv[1:7]
          with open("release-notes.md", encoding="utf-8") as handle:
              changelog = handle.read()
          payload = {
              "channel": channel,
              "versionName": version_name,
              "versionCode": int(version_code),
              "sha256": sha,
              "sizeBytes": int(size),
              "changelog": changelog,
              "urls": [url],
              "minSupportedVersionCode": 0,
          }
          with open("update.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, ensure_ascii=False, indent=2)
          PY

      - name: Publish release
        if: steps.version.outputs.dry_run != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$apk" ]]; then
            echo "::error::APK not found."
            exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"
          if [[ "$CHANNEL" == "rc" ]]; then
            gh release create "$TAG" "$apk" app-release.apk.sha256 update.json \
              --title "FishPi ${VERSION_NAME}" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "$TAG" "$apk" app-release.apk.sha256 update.json \
              --title "FishPi ${VERSION_NAME}" \
              --notes-file release-notes.md \
              --latest
          fi

      - name: Upload dry run artifacts
        if: steps.version.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fishpi-${{ steps.version.outputs.version_name }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            app-release.apk.sha256
            update.json
            release-notes.md
